<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5a4867">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Caring Hands">
  <link rel="apple-touch-icon" href="icon-192.png?v=5">
  <link rel="manifest" href="manifest.webmanifest">
  <title>The Caring Hands — Manager Hub</title>
  <style>
    :root{--ink:#33223d;--brand:#554561;--brand-dark:#341a3d;--paper:#554561;--line:#d7c9de;--red:#a0679d;--green:#5a4867;--muted:#66596c;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#f0eaf3;color:var(--brand);border-bottom:3px solid #b993c1;padding:calc(18px + env(safe-area-inset-top)) 18px 20px}.brand{max-width:800px;margin:auto;display:flex;align-items:center;gap:18px}.brand-logo{width:138px;height:138px;object-fit:contain;object-position:center 16px;border:0;border-radius:0;background:#fff;display:block;margin-top:16px}.brand small{font-weight:800;letter-spacing:.14em;font-size:.98rem;opacity:.85}.brand h1{font-size:2.15rem;line-height:1.05;margin:3px 0 5px;letter-spacing:.01em}main{max-width:800px;margin:auto;padding:18px 14px 38px}.intro{font-size:.94rem;color:var(--muted);margin:0 0 16px}.hub-grid{display:grid;gap:12px}.hub-card{width:100%;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(130px,.85fr);text-align:left;cursor:pointer;box-shadow:none;min-height:118px}.hub-card:focus-visible{outline:3px solid #4aa88b;outline-offset:2px}.hub-title{padding:19px 17px;display:flex;flex-direction:column;justify-content:center;gap:8px}.hub-title h2{font-size:1.22rem;margin:0;color:var(--brand-dark)}.hub-title p,.hub-arrow{display:none}.overview{padding:15px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:6px}.overview b{font-size:1.55rem;line-height:1}.overview span{font-size:.76rem;font-weight:750;line-height:1.25}.overview.red{background:#f4e8f2;color:#7b3d70}.overview.green,.overview.grey{background:#f0eaf3;color:#4f3c59}.overview .dot{display:none}.overview .dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block;margin-right:5px}.view-head{display:flex;align-items:center;gap:11px;margin-bottom:15px}.back{border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--brand-dark);padding:9px 11px;font:inherit;font-weight:750;cursor:pointer}.view-head h2{font-size:1.3rem;margin:0}.notice{background:#fff8dc;border:1px solid #efd58a;border-radius:12px;padding:11px 13px;margin:0 0 14px;font-size:.9rem}.actions,.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 18px}button{appearance:none;border:0;border-radius:10px;background:var(--brand);color:white;font:inherit;font-weight:700;padding:11px 14px;min-height:44px;cursor:pointer}button.secondary{background:#e3eeea;color:var(--ink)}button.danger{background:var(--red)}button.tab{background:transparent;color:var(--muted);border:1px solid var(--line)}button.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 20px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.metric b{font-size:1.7rem;display:block}.metric.red b{color:var(--red)}.metric.green b{color:var(--green)}.metric small{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}.staff-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.staff-name{font-size:1.08rem;font-weight:750}.staff-id,.small{font-size:.87rem;color:var(--muted)}.badge{border-radius:99px;padding:4px 9px;font-weight:750;font-size:.8rem}.red{background:#fce7e5;color:#8e2119}.green{background:#e4f5ea;color:#17633c}.issues{font-size:.92rem;margin:.6rem 0;color:#435255}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.placeholder{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px}.placeholder h3{margin:0 0 7px}.placeholder p{margin:0;color:var(--muted)}dialog{border:0;border-radius:16px;padding:0;max-width:680px;width:calc(100% - 24px);box-shadow:0 15px 60px #0008}dialog::backdrop{background:#10252a99}.modal-head{padding:16px 18px;background:var(--brand);color:#fff;display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:1.15rem;margin:0}.modal-head button{padding:4px 9px;background:transparent;font-size:1.25rem}.form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.form .full{grid-column:1/-1}.form label{font-size:.86rem;font-weight:700}.form input{display:block;width:100%;margin-top:5px;border:1px solid #b8c9c5;border-radius:8px;padding:10px;font:inherit;min-height:44px;background:#fff}.checks{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{border:1px solid var(--line);border-radius:8px;padding:7px 9px;display:flex;gap:8px;align-items:center;font-size:.88rem}.check input{width:auto;min-height:auto;margin:0}.modal-actions{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.export-label{position:relative;overflow:hidden}.export-label input{position:absolute;inset:0;opacity:0;cursor:pointer}@media(max-width:520px){.hub-card{grid-template-columns:1.12fr .88fr}.overview{padding:13px 11px}.hub-title{padding:17px 14px}.summary{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.checks{grid-template-columns:1fr}.form .full,.modal-actions{grid-column:auto}}@media print{header,.actions,.tabs,.notice,button{display:none}}
  </style>
</head>
<body>
<header><div class="brand"><img class="brand-logo" src="heart-home-icon.png?v=8" alt="The Caring Hands heart and home icon"><div><h1>THE CARING HANDS</h1><small>MANAGER HUB</small></div></div></header>
<main>
  <section id="homeView"><div id="hubGrid" class="hub-grid"></div></section>
  <section id="moduleView" class="hidden"></section>
</main>
<dialog id="staffDialog"><div class="modal-head"><h2 id="dialogTitle">Add staff member</h2><button id="closeDialog" aria-label="Close">×</button></div><form id="staffForm" class="form"><input id="recordId" type="hidden"><label>Staff initials / name<input required id="name" maxlength="80" placeholder="e.g. AC"></label><label>Staff ID / folder reference<input id="staffId" maxlength="40" placeholder="Optional"></label><label>Car MOT expiry<input id="mot" type="date"></label><label>Car insurance expiry<input id="insurance" type="date"></label><label>DBS review date<input id="dbsReview" type="date"></label><label>Other document review date<input id="otherReview" type="date"></label><div class="full"><label>Notes (no sensitive document details)<input id="notes" maxlength="240" placeholder="e.g. request signed job description"></label></div><div class="checks" id="checks"></div><div class="modal-actions"><button type="button" class="danger hidden" id="deleteBtn">Delete record</button><span></span><button type="button" class="secondary" id="cancelBtn">Cancel</button><button type="submit">Save staff record</button></div></form></dialog>
<script>
const KEY='staff-folder-manager-v3',SETTING_KEY='staff-folder-manager-settings-v2';
const checklist=['Application form','Passport photo','Interview questions','ID checked & verified','Reference 1','Reference 1 verified','Reference 2','Reference 2 verified','Advanced DBS recorded','Contract for services signed','Job offer letter signed','Job description signed','Person specification signed','Emergency procedure signed','DBS fee & declaration signed','Policies & procedure declaration signed','Use of own car form signed','Supervision & appraisal contract signed','Health declaration signed','Shadowing completed'];
const $=s=>document.querySelector(s),escape=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
let records=JSON.parse(localStorage.getItem(KEY)||'[]'),settings=JSON.parse(localStorage.getItem(SETTING_KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(SETTING_KEY,JSON.stringify(settings));renderHome();if(!$('#moduleView').classList.contains('hidden'))showModule('staff')}
function dayDiff(d){if(!d)return null;const a=new Date(d+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000)}
function issueFor(r){let out=[];[['mot','MOT'],['insurance','Car insurance'],['dbsReview','DBS review'],['otherReview','Other review']].forEach(([k,label])=>{let n=dayDiff(r[k]);if(n!==null&&n<0)out.push({level:'red',text:`${label} expired ${Math.abs(n)} day${Math.abs(n)===1?'':'s'} ago`})});let missing=checklist.filter(c=>!r.checks?.includes(c));if(missing.length)out.push({level:'red',text:`${missing.length} checklist item${missing.length===1?'':'s'} missing or not confirmed`});return out}
function status(r){return issueFor(r).length?'red':'green'}
function staffSummary(){let red=records.filter(r=>status(r)==='red').length;return {count:red,tone:red?'red':'green',top:red?`${red} staff record${red===1?'':'s'} need attention`:'No staff actions'}}
const modules=[{id:'staff',title:'Staff folders',sub:'Documents, checks and expired vehicle dates',summary:staffSummary},{id:'compliance',title:'Spot checks, field checks & competencies',sub:'Checks requiring manager action',summary:()=>({count:0,tone:'green',top:'No actions recorded'})},{id:'training',title:'Training',sub:'Training requiring action',summary:()=>({count:0,tone:'green',top:'No actions recorded'})},{id:'reviews',title:'Client reviews',sub:'Client reviews requiring action',summary:()=>({count:0,tone:'green',top:'No actions recorded'})}];
function renderHome(){ $('#hubGrid').innerHTML=modules.map(m=>{let s=m.summary();return `<button class="hub-card" onclick="showModule('${m.id}')"><span class="hub-title"><h2>${m.title}</h2></span><span class="overview ${s.tone}"><b>${s.count}</b><span>${s.top}</span></span></button>`}).join('')}
function backHome(){$('#moduleView').classList.add('hidden');$('#homeView').classList.remove('hidden');renderHome()}
function showModule(id){$('#homeView').classList.add('hidden');let area=$('#moduleView');area.classList.remove('hidden');if(id!=='staff'){let m=modules.find(x=>x.id===id);area.innerHTML=`<div class="view-head"><button class="back" onclick="backHome()">← Home</button><h2>${m.title}</h2></div><div class="placeholder"><h3>Ready for this area</h3><p>This section is set up from the home screen. Once you provide the checklist or spreadsheet used for ${m.title.toLowerCase()}, I will add its exact fields and action overview here.</p></div>`;return}renderStaffModule()}
function label(s){return s==='red'?'Action needed':'Acceptable'}
function card(r){const issues=issueFor(r),s=status(r);return `<article class="card"><div class="staff-top"><div><div class="staff-name">${escape(r.name)}</div><div class="staff-id">${escape(r.staffId||'No folder reference')}</div></div><span class="badge ${s}">${label(s)}</span></div><div class="issues">${issues.length?issues.map(i=>`• ${escape(i.text)}`).join('<br>'):'All checklist items confirmed and no recorded dates have passed.'}</div>${r.notes?`<div class="small">Note: ${escape(r.notes)}</div>`:''}<div class="actions"><button class="secondary" onclick="editRecord('${r.id}')">View / update</button></div></article>`}
function renderStaffModule(){let att=records.filter(r=>status(r)==='red'),reds=att.length,greens=records.length-reds;$('#moduleView').innerHTML=`<div class="view-head"><button class="back" onclick="backHome()">← Home</button><h2>Staff folders</h2></div><div class="notice"><strong>Status:</strong> green means acceptable; red means information is missing or a date has passed. Future dates do not create alerts.</div><div class="actions"><button id="addBtn">+ Add staff member</button><button class="secondary" id="notifyBtn">Device alerts — setup</button><button class="secondary" id="exportBtn">Export backup</button><label class="secondary export-label"><input id="importInput" type="file" accept="application/json">Import backup</label></div><nav class="tabs"><button class="tab active" data-view="attention">Needs attention</button><button class="tab" data-view="all">All staff</button><button class="tab" data-view="settings">Daily alerts</button></nav><section id="attentionView"></section><section id="allView" class="hidden"></section><section id="settingsView" class="hidden"></section>`;let metrics=`<div class="summary"><div class="metric"><b>${records.length}</b><small>Staff records</small></div><div class="metric red"><b>${reds}</b><small>Red — action needed</small></div><div class="metric green"><b>${greens}</b><small>Green — acceptable</small></div></div>`;$('#attentionView').innerHTML=metrics+(att.length?att.map(card).join(''):'<div class="empty">Nothing needs attention. All records are currently acceptable.</div>');$('#allView').innerHTML=metrics+(records.length?records.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(card).join(''):'<div class="empty">No staff records yet.</div>');$('#settingsView').innerHTML=`<div class="placeholder"><h3>Daily WhatsApp alerts</h3><p>The daily digest includes red cells and dates that have already expired. Future dates never trigger an alert. The separate WhatsApp Business account will be connected after the target group and send time are approved.</p></div>`;$('#addBtn').onclick=()=>openRecord();$('#notifyBtn').onclick=requestAlerts;$('#exportBtn').onclick=exportData;$('#importInput').onchange=importData;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['attention','all','settings'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==b.dataset.view))})}
function formChecks(selected=[]){$('#checks').innerHTML=checklist.map(c=>`<label class="check"><input type="checkbox" value="${escape(c)}" ${selected.includes(c)?'checked':''}>${escape(c)}</label>`).join('')}
function openRecord(r){$('#dialogTitle').textContent=r?'Update staff member':'Add staff member';$('#recordId').value=r?.id||'';$('#name').value=r?.name||'';$('#staffId').value=r?.staffId||'';$('#mot').value=r?.mot||'';$('#insurance').value=r?.insurance||'';$('#dbsReview').value=r?.dbsReview||'';$('#otherReview').value=r?.otherReview||'';$('#notes').value=r?.notes||'';formChecks(r?.checks||[]);$('#deleteBtn').classList.toggle('hidden',!r);$('#staffDialog').showModal()}
window.editRecord=id=>openRecord(records.find(r=>r.id===id));window.showModule=showModule;window.backHome=backHome;
$('#closeDialog').onclick=$('#cancelBtn').onclick=()=>$('#staffDialog').close();$('#staffForm').onsubmit=e=>{e.preventDefault();let id=$('#recordId').value,r={id:id||crypto.randomUUID(),name:$('#name').value.trim(),staffId:$('#staffId').value.trim(),mot:$('#mot').value,insurance:$('#insurance').value,dbsReview:$('#dbsReview').value,otherReview:$('#otherReview').value,notes:$('#notes').value.trim(),checks:[...document.querySelectorAll('#checks input:checked')].map(x=>x.value),updatedAt:new Date().toISOString()};if(id)records=records.map(x=>x.id===id?r:x);else records.push(r);save();$('#staffDialog').close()};$('#deleteBtn').onclick=()=>{let id=$('#recordId').value;if(confirm('Delete this staff record?')){records=records.filter(r=>r.id!==id);save();$('#staffDialog').close()}};
function exportData(){let data=JSON.stringify({app:'Staff Folder Manager',version:2,exportedAt:new Date().toISOString(),records,settings},null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`staff-folder-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.records))throw Error();if(confirm(`Replace current data with ${d.records.length} imported record(s)?`)){records=d.records;settings=d.settings||settings;save()}}catch{alert('That file is not a valid Staff Folder Manager backup.')}e.target.value=''}
async function requestAlerts(){if(!('Notification'in window))return alert('This browser does not support device alerts. The daily WhatsApp Business summary remains the reliable option.');if(Notification.permission==='granted')return alert('Device alerts are already enabled.');if(Notification.permission==='denied')return alert('Device alerts have been blocked. On iPhone/iPad, add the app to the Home Screen from Safari, open it, then allow notifications in Settings › Notifications › Caring Hands.');let p=await Notification.requestPermission();alert(p==='granted'?'Device alerts enabled.':'On iPhone/iPad, add this app to the Home Screen from Safari first; browser tabs cannot request notifications.')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');renderHome();
</script></body></html>
